name: 🏗️ New Service Request
description: Suggest a new service for ScaleTail
title: '🏗️ New Service: '
type: 'Feature'
labels: "new service"
body:
  - type: markdown
    attributes:
      value: |
        This issue type is intended to be used to request new services for ScaleTail. 
        Only services with an existing Docker Compose container on a known container image registry (e.g., Docker Hub, GitHub Container Registry, etc.) are accepted.
        
        **Before you start:**
        Please check if the service has already been requested by searching [existing service requests](https://github.com/tailscale-dev/ScaleTail/issues?q=label%3A%22new%20service%22).

  - type: textarea
    id: description
    attributes:
      label: Service Description
      description: A clear and concise description of the service you'd like to see implemented.
      placeholder: I would like to see {SERVICE} implemented...
    validations:
      required: true

  - type: input
    id: service-name
    attributes:
      label: Proposed Service Name
      description: The lowercase directory name to use under services/.
      placeholder: service-name
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Maintained Container Image
      description: Provide the official registry image and a tag or release reference.
      placeholder: ghcr.io/owner/service:1.2.3
    validations:
      required: true

  - type: input
    id: link-to-compose
    attributes:
      label: Docker Compose File Link
      description: Please provide a link to your Docker Compose file.
      placeholder: https://link.to/service.yml
    validations:
      required: true

  - type: textarea
    id: compose-example
    attributes:
      label: Docker Compose Configuration
      description: If applicable, please share the Docker Compose content from the service.
      placeholder: |
        Paste the Docker Compose content here...

      render: yaml
    validations:
      required: false

  - type: input
    id: link-to-website-of-service
    attributes:
      label: Website of Service
      description: Please provide a link to the official website of the service.
      placeholder: https://servicename.com/service
    validations:
      required: true

  - type: textarea
    id: runtime-details
    attributes:
      label: Runtime Details
      description: Document the internal HTTP/HTTPS/UDP ports, persistent paths, dependencies, required permissions/devices, and supported architectures.
      placeholder: |
        Internal port(s):
        Persistent paths:
        Dependencies:
        Required capabilities/devices:
        Architectures:
    validations:
      required: true

  - type: textarea
    id: official-docs
    attributes:
      label: Official Install and Compose Documentation
      description: Link the upstream installation, Docker image, and configuration documentation used to verify the proposal.
      placeholder: https://docs.example.com/self-hosting
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you be willing to work on this service?
      options:
        - label: Yes, I'd like to implement this feature
        - label: I could help with parts of this feature
        - label: No, I'm just suggesting the feature
    validations:
      required: true
